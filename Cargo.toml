[package]
name = "sigmaos-security-hardening"
version = "0.1.0"
edition = "2021"
description = "SigmaOS security hardening system"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-security-hardening"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
directories = "5.0"

[dev-dependencies]
tempfile = "3.0"
